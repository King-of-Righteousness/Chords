<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <meta name="theme-color" content="#272727" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-192.png">
  <title>KOR | Worship Reader (Hybrid)</title>
  <link rel="icon" type="image/ico" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <!-- accent colour (shared with the other Worship tools) applied before first paint -->
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('worship-theme') || 'indigo'); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'indigo'); }
  </script>

  <style>
/* This rule applies ONLY to Desktop screens */
    @media (min-width: 1024px) {
        body {
            zoom: 75%;
            width: 133.33vw !important;
            height: 133.33vh !important;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
    }

    /* This rule applies ONLY to Mobile/Tablets so it stays readable */
    @media (max-width: 1023px) {
        body {
            zoom: 100%;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
    }

    /* =====================================================
       READER · same design family as Hub / Worship Suite
       (token NAMES are unchanged because the reader script uses them)
       ===================================================== */
    :root {
      /* --- READER THEME (dark = default, like before) --- */
      --bg: #0e0f12;
      --panel: #1a1b20;
      --surface: #212227;
      --dock-bg: rgba(27, 28, 33, 0.94);
      --nav-bg: rgba(19, 20, 23, 0.92);
      --dark: #131417;
      --text: #ececef;
      --text-muted: #9a9aa4;
      --chord: #f87171;          /* chord colour is NOT tied to the accent theme */
      --section: #10b981;
      --border: rgba(255, 255, 255, 0.10);
      --input-bg: #14151a;
      --accent: #6366F1; --accent-text: #A5B4FC; --accent-rgb: 99, 102, 241;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-ui: 'Poppins', 'Segoe UI', Tahoma, sans-serif;

      /* --- PRINT THEME (Independent) --- */
      --print-text-size: 12pt;
      --print-chord-size: 14pt;
      --print-line-height: 1.35;
      --print-col-gap: 40px;
      --bg-preview: #f1f5f9;
      --panel-bg: #ffffff;
      --border-color: #e2e8f0;
      --font-header: 'Playfair Display', serif;
      --font-mono: 'JetBrains Mono', monospace;
      --print-chord-color: #b91c1c;
    }
    /* accent colours: lighter in dark mode (contrast), true brand colour in light mode */
    :root[data-theme="red"]     { --accent: #E5483C; --accent-text: #FCA5A5; --accent-rgb: 229, 72, 60; }
    :root[data-theme="emerald"] { --accent: #10B981; --accent-text: #6EE7B7; --accent-rgb: 16, 185, 129; }

    .light {
      --bg: #f6f6f7;
      --panel: #ffffff;
      --surface: #fafafa;
      --dock-bg: rgba(255, 255, 255, 0.95);
      --nav-bg: rgba(39, 39, 39, 0.96);
      --dark: #272727;
      --text: #1f1f23;
      --text-muted: #6b6b75;
      --chord: #dc2626;
      --section: #059669;
      --border: #e3e3e6;
      --input-bg: #fafafa;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
    }
    :root[data-theme="indigo"] .light  { --accent: #4F46E5; --accent-text: #4338CA; --accent-rgb: 79, 70, 229; }
    :root[data-theme="red"] .light     { --accent: #DA291C; --accent-text: #C4241A; --accent-rgb: 218, 41, 28; }
    :root[data-theme="emerald"] .light { --accent: #059669; --accent-text: #047857; --accent-rgb: 5, 150, 105; }

    * { box-sizing: border-box; }
    html { background: #0e0f12; -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font-ui); font-size: 14px; line-height: 1.5; background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; min-height: 100vh; padding-bottom: 8rem; margin: 0; transition: background-color 0.3s ease, color 0.3s ease; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.45); }
    .hidden { display: none !important; }

    /* --- RESTORED READER CSS (Strictly from Reader.txt) — DO NOT CHANGE: this is what keeps chords aligned --- */
    .reader {
      font-family: 'JetBrains Mono', monospace;
      font-variant-ligatures: none;
      white-space: pre !important; /* CRITICAL FOR CHORD ALIGNMENT */
      line-height: 1.8;
    }

    .reader-line {
      break-inside: avoid;
      page-break-inside: avoid;
      min-height: 1.8em;
    }

    .chord {
      color: var(--chord);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .section-label {
      color: var(--section);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
      display: inline-block;
      margin-top: 1em;
      margin-bottom: 0.2em;
    }
    @media (min-width: 900px) { .two-col { column-count: 2; column-gap: 40px; column-rule: 1px solid var(--border); } }

    /* small utility classes used by markup that the reader script generates (it used Tailwind names) */
    .whitespace-nowrap { white-space: nowrap; } .text-xs { font-size: 0.75rem; line-height: 1rem; } .text-muted { color: var(--text-muted); }
    .w-full { width: 100%; } .text-center { text-align: center; } .text-right { text-align: right; } .py-1 { padding: 0.25rem 0; }
    .italic { font-style: italic; } .opacity-50 { opacity: 0.5; } .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-bold { font-weight: 700; } .w-6 { width: 1.5rem; flex-shrink: 0; } .flex-1 { flex: 1 1 0%; } .min-w-0 { min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (min-width: 640px) { .hidden.sm\:inline { display: inline !important; } }

    /* ---------- header ---------- */
    .glass-nav {
      position: sticky; top: 0; z-index: 50; width: 100%; height: 64px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 24px;
      background: var(--nav-bg); color: #fff; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 0 0 20px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.18); overflow: hidden;
    }
    .glass-nav::before { content: ""; position: absolute; width: 200px; height: 200px; border-radius: 50%; background: var(--accent); opacity: 0.18; top: -140px; right: 18%; pointer-events: none; transition: background 0.4s; }
    .nav-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; position: relative; }
    .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; position: relative; }
    @keyframes korPulse{ 0%,100% { transform: scale(1); box-shadow: 0 0 0 rgba(var(--accent-rgb),0); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(var(--accent-rgb),0.5); } }
    .korLogo { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; animation: korPulse 3s ease-in-out infinite; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
    .korLogo img { width: 24px; height: 24px; border-radius: 6px; display: block; object-fit: cover; }
    .nav-title { min-width: 0; line-height: 1.15; }
    #titleEl { margin: 0; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.1px; }
    #artistEl { margin: 2px 0 0; font-size: 11px; font-weight: 500; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #syncStatus { display: none; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #a1a1aa; }
    @media (min-width: 768px) { #syncStatus { display: block; } }
    .nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; text-decoration: none; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); transition: all 0.2s var(--ease); }
    .nav-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .nav-btn.primary { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 12px rgba(var(--accent-rgb), 0.45); }
    .nav-btn.primary:hover { filter: brightness(1.1); }
    .nav-btn.green { color: #6EE7B7; border-color: rgba(110,231,183,0.4); }

    /* ---------- main ---------- */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 32px; }
    .song-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    #songSelect { flex: 1 1 260px; max-width: 420px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: 600 14px var(--font-ui); outline: none; cursor: pointer; box-shadow: var(--shadow); transition: border-color 0.2s, box-shadow 0.2s; }
    #songSelect:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2); }
    #keyDisplayBtn { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); color: var(--text-muted); font-size: 12px; font-weight: 600; box-shadow: var(--shadow); transition: all 0.2s var(--ease); }
    #keyDisplayBtn:hover { border-color: var(--accent); transform: translateY(-1px); }
    #transKeyEl { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; min-width: 44px; text-align: center; padding: 4px 10px; border-radius: 9px; background: rgba(var(--accent-rgb), 0.14); color: var(--accent-text); }

    #mainFamilyDisplay { display: flex; align-items: stretch; justify-content: center; gap: 8px; padding: 10px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
    .family-pill { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 30px; max-width: 110px; padding: 6px 4px; border-radius: 12px; background: var(--surface); transition: transform 0.2s var(--ease); }
    .family-pill:hover { transform: translateY(-2px); }
    .family-degree { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 0.05em; }
    .family-chord { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
    .family-chord.primary { color: var(--accent-text); }
    .family-chord.dim { color: var(--text-muted); font-weight: 500; }
    #gearFamilyDisplay { display: flex; justify-content: space-between; width: 100%; gap: 4px; }
    #gearFamilyDisplay .family-pill { background: transparent; padding: 2px; }

    #capoDisplay { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; margin-bottom: 14px; padding: 8px 12px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-text); border-radius: 12px; background: rgba(var(--accent-rgb), 0.08); border: 1px dashed rgba(var(--accent-rgb), 0.35); }
    #capoDisplay:empty { display: none; }
    @media (min-width: 640px) { #capoDisplay { flex-direction: row; gap: 16px; } }

    #reader { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px 26px; box-shadow: var(--shadow); font-size: 20px; overflow-x: auto; transition: background-color 0.3s ease, border-color 0.3s ease; }

    /* ---------- dock ---------- */
    .float-dock { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; padding: 6px; gap: 4px; border-radius: 20px; background: var(--dock-bg); border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(0,0,0,0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: opacity 0.3s ease, background-color 0.3s ease; }
    .dock-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 14px; background: transparent; color: var(--text-muted); font-size: 16px; font-weight: 700; transition: all 0.2s var(--ease); }
    .dock-btn:hover { background: rgba(var(--accent-rgb), 0.14); color: var(--accent-text); transform: translateY(-2px); }
    .dock-btn:active { transform: scale(0.94); }
    .dock-btn.small-text { font-size: 12px; font-weight: 800; }
    .dock-sep { width: 1px; height: 26px; margin: 0 2px; background: var(--border); }
    .dock-desktop { display: none; }
    @media (min-width: 640px) { .dock-desktop { display: inline-flex; } .dock-sep.dock-desktop { display: block; } .dock-btn { width: 48px; height: 48px; } }

    /* ---------- sheets ---------- */
    .sheet-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,22,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade 0.25s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }
    .sheet { width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: pop 0.4s var(--ease); }
    .sheet-head { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); }
    .sheet-head h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .sheet-head h3::before { content: ""; width: 5px; height: 20px; border-radius: 3px; background: var(--accent); }
    .sheet-sub { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    .x-close { background: none; border: none; width: 34px; height: 34px; border-radius: 10px; color: var(--text-muted); font-size: 16px; }
    .x-close:hover { background: var(--surface); color: var(--text); }
    #setlistList { flex: 1; overflow-y: auto; padding: 14px; background: var(--bg); }
    .sheet-foot { padding: 16px 22px; display: flex; gap: 10px; border-top: 1px solid var(--border); background: var(--panel); }
    .btn { flex: 1; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.2s var(--ease); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { border-color: var(--accent); color: var(--accent-text); transform: translateY(-1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.4); }
    .btn.primary:hover { color: #fff; filter: brightness(1.08); }

    .songCard { background: var(--panel); border: 1px solid var(--border); padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; transition: all 0.2s var(--ease); }
    .songCard:hover { border-color: rgba(var(--accent-rgb), 0.5); transform: translateX(2px); }
    .setlistRow { display: flex; align-items: center; width: 100%; gap: 10px; }
    .setlistRow > div:first-child { color: var(--accent-text) !important; }
    .btnGroup { margin-left: auto; display: flex; gap: 4px; }
    .moveBtn, .removeBtn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--surface); color: var(--text); border: 1px solid var(--border); cursor: pointer; font-size: 12px; transition: all 0.2s; }
    .moveBtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
    .removeBtn { background: rgba(220,38,38,0.12); color: #f87171; border-color: rgba(220,38,38,0.35); }
    .removeBtn:hover { background: rgba(220,38,38,0.25); }

    /* ---------- gear panel ---------- */
    #gearPanel { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 460px; max-height: calc(100vh - 140px); overflow-y: auto; z-index: 55; padding: 20px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: popCentered 0.35s var(--ease); }
    @keyframes popCentered { from { opacity: 0; transform: translate(-50%, 16px) scale(0.96); } to { opacity: 1; transform: translateX(-50%); } }
    .panel-title { margin: 0 0 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
    .only-mobile { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    @media (min-width: 640px) { .only-mobile { display: none; } }
    .mobile-row { display: flex; gap: 8px; }
    #gearPanel .mobile-row .btn { width: auto; flex: 1 1 0; padding: 12px 6px; margin-bottom: 0; }
    #keyRow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-bottom: 18px; }
    .key-btn { height: 38px; border-radius: 10px; background: var(--surface); color: var(--text); font: 700 13px 'JetBrains Mono', monospace; border: 1px solid var(--border); transition: all 0.2s var(--ease); }
    .key-btn:hover { border-color: var(--accent); color: var(--accent-text); transform: translateY(-1px); }
    .key-btn.active { background: var(--accent); border-color: var(--accent); color: #ffffff; box-shadow: 0 3px 10px rgba(var(--accent-rgb), 0.45); }
    #gearFamilyContainer { margin-bottom: 18px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--input-bg); display: flex; flex-direction: column; align-items: center; }
    .gear-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 10px; }
    .theme-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .theme-switch { display: flex; gap: 10px; }
    .theme-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); padding: 0; transition: transform 0.2s var(--ease); }
    .theme-dot[data-theme="indigo"] { background: #4F46E5; } .theme-dot[data-theme="red"] { background: #DA291C; } .theme-dot[data-theme="emerald"] { background: #059669; }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { border-color: var(--text); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.3); }
    #gearPanel .btn { width: 100%; flex: none; margin-bottom: 10px; }
    #gearPanel .btn:last-child { margin-bottom: 0; }

    /* ---------- status toast (the reader script toggles opacity-0 / -translate-y-2 on it) ---------- */
    #statusOverlay { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 999px; background: rgba(19,20,23,0.96); backdrop-filter: blur(8px); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s ease; pointer-events: none; opacity: 1; }
    #statusOverlay.opacity-0 { opacity: 0; }
    #statusOverlay.-translate-y-2 { transform: translate(-50%, -8px); }
    .light #statusOverlay { background: rgba(255, 255, 255, 0.97); }
    #statusText { font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: var(--accent); }
    #statusSpinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- install banner ---------- */
    #installPrompt { position: fixed; bottom: 100px; left: 5%; width: 90%; max-width: 440px; margin: 0 auto; right: 5%; z-index: 9999; padding: 12px 14px; border-radius: 18px; background: #fff; color: #1f1f23; border: 1px solid #e3e3e6; box-shadow: 0 16px 40px rgba(0,0,0,0.3); animation: pop 0.4s var(--ease); }
    #closeInstallBtn { position: absolute; top: 4px; right: 8px; background: none; border: none; font-size: 22px; color: #8a8a93; z-index: 10; }
    .install-row { display: flex; align-items: center; gap: 12px; padding: 4px 22px 4px 4px; }
    .install-row img { width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0; }
    .install-row h6 { margin: 0; font-size: 14px; font-weight: 700; }
    #installMessage { margin: 0; font-size: 12px; color: #6b6b75; line-height: 1.35; }
    #installBtn { display: none; width: 100%; margin: 10px 0 0; padding: 10px 16px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.4); }
    .bi-upload::before { content: "⬆️"; font-style: normal; } .bi-plus-square::before { content: "➕"; font-style: normal; }

    /* ---------- responsive ---------- */
    @media (max-width: 640px) {
      .glass-nav { padding: 0 14px; height: 60px; }
      .nav-btn { padding: 7px 10px; font-size: 11px; }
      .wrap { padding: 14px 12px; }
      #reader { padding: 14px 14px; border-radius: 16px; }
      #mainFamilyDisplay { gap: 4px; padding: 8px; }
      .family-chord { font-size: 12px; }
      #statusOverlay { top: 68px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

    /* --- ISOLATED PRINT VIEW STYLES (Does not affect Reader) --- */
    #printOverlay {

    /* Print Reader Styles (Isolated) */

        font-family: var(--font-mono);
        white-space: pre-wrap;
        font-size: var(--print-text-size);
        line-height: var(--print-line-height);

    /* Replicate structure for Print context */

    .print-reader .section-label {

    /* Print Columns */
    .cols1 .print-reader { column-count:1; column-gap: var(--print-col-gap); }

    /* Toggle Switch */
    .toggle-label { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; }

    @page { size: A4; margin: 10mm; }

    @media print {
        body > *:not(#printOverlay) { display: none !important; }
        #printOverlay { display: block !important; position: absolute; background: white; overflow: visible; }

  </style>
</head>

<script> 
/* =========================
   Reader — Firebase-Only Edition
========================= */

// --- MUSIC THEORY ENGINE ---
const KEY_FAMILIES = {
    "C":  ["C", "Dm", "Em", "F", "G", "Am", "Bdim"], "Db": ["Db", "Ebm", "Fm", "Gb", "Ab", "Bbm", "Cdim"], "C#": ["Db", "Ebm", "Fm", "Gb", "Ab", "Bbm", "Cdim"], 
    "D":  ["D", "Em", "F#m", "G", "A", "Bm", "C#dim"], "Eb": ["Eb", "Fm", "Gm", "Ab", "Bb", "Cm", "Ddim"], "D#": ["Eb", "Fm", "Gm", "Ab", "Bb", "Cm", "Ddim"], 
    "E":  ["E", "F#m", "G#m", "A", "B", "C#m", "D#dim"], "F":  ["F", "Gm", "Am", "Bb", "C", "Dm", "Edim"], "Gb": ["Gb", "Abm", "Bbm", "Cb", "Db", "Ebm", "Fdim"],
    "F#": ["F#", "G#m", "A#m", "B", "C#", "D#m", "E#dim"], "G":  ["G", "Am", "Bm", "C", "D", "Em", "F#dim"], "Ab": ["Ab", "Bbm", "Cm", "Db", "Eb", "Fm", "Gdim"],
    "G#": ["Ab", "Bbm", "Cm", "Db", "Eb", "Fm", "Gdim"], "A":  ["A", "Bm", "C#m", "D", "E", "F#m", "G#dim"], "Bb": ["Bb", "Cm", "Dm", "Eb", "F", "Gm", "Adim"],
    "A#": ["Bb", "Cm", "Dm", "Eb", "F", "Gm", "Adim"], "B":  ["B", "C#m", "D#m", "E", "F#", "G#m", "A#dim"], "Cb": ["B", "C#m", "D#m", "E", "F#", "G#m", "A#dim"] 
};
const CAPO_DATA = {
    "A":  { text: "use Capo 'Fret' 2", key: "G" }, "Bb": { text: "use Capo 'Fret' 3", key: "G" }, "A#": { text: "use Capo 'Fret' 3", key: "G" },
    "B":  { text: "use Capo 'Fret' 4", key: "G" }, "C":  { text: "Open (C) or use Capo 'Fret' 5", key: "G" }, "Db": { text: "use Capo 'Fret' 1", key: "C" },
    "C#": { text: "use Capo 'Fret' 1", key: "C" }, "D":  { text: "use Capo 'Fret' 2", key: "C" }, "Eb": { text: "use Capo 'Fret' 3", key: "C" },
    "D#": { text: "use Capo 'Fret' 3", key: "C" }, "E":  { text: "use Capo 'Fret' 4", key: "C" }, "F":  { text: "use Capo 'Fret' 5 (C) or Capo 'Fret' 1", key: "E" },
    "Gb": { text: "use Capo 'Fret' 2", key: "E" }, "F#": { text: "use Capo 'Fret' 2", key: "E" }, "G":  { text: "Open", key: "G" },
    "Ab": { text: "use Capo 'Fret' 1", key: "G" }, "G#": { text: "use Capo 'Fret' 1", key: "G" }
};
const FAMILY_DEGREES = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];

// --- STORAGE KEYS ---
const READER_STORAGE_KEY = 'chord_manager_reader_data_v1';
const ALL_SONGS_KEY = 'chord_manager_all_songs';
const PLAYLIST_KEY = 'chord_manager_playlist';
const CURRENT_ID_KEY = 'chord_manager_current_song_id';
const THEME_PREF_KEY = 'chord_reader_theme';
const COLS_PREF_KEY  = 'chord_reader_columns';

// --- HYBRID BRIDGE FUNCTIONS (Called by Firebase) ---
window.updateLocalSetlist = function(newPlaylist) {
    setSyncStatus('Updating Setlist...', 0);
    if(!Array.isArray(newPlaylist)) return;
    
    // Accept Firebase payload directly (No filtering)
    playlist = newPlaylist;
    try { localStorage.setItem(PLAYLIST_KEY, JSON.stringify(playlist)); } catch(e){}
    
    // Notice we removed normalizePlaylist() here to prevent accidental deletion
    populateDropdown();
    
    if(currentId && !playlist.includes(currentId)) currentId = playlist[0] || null;
    if(!currentId && playlist.length > 0) currentId = playlist[0];
    if(currentId) loadSongById(currentId);
    
    setTimeout(() => {
        setSyncStatus('Setlist Updated', null); 
        setTimeout(()=>setSyncStatus(''), 2000);
    }, 600);
};

window.updateLocalSong = function(id, data) {
    setSyncStatus('Receiving Edit...', 0);
    const idx = window.allSongs.findIndex(s => s.id === id);
    if(idx > -1) { window.allSongs[idx] = { ...window.allSongs[idx], ...data }; } 
    else { window.allSongs.push(data); }
    try { localStorage.setItem(ALL_SONGS_KEY, JSON.stringify(window.allSongs)); } catch(e){}
    
    if(currentId === id) { 
        loadSongById(id); 
        setTimeout(() => {
            setSyncStatus('Live Edit Received', null); 
            setTimeout(()=>setSyncStatus(''), 2000);
        }, 600); 
    }
};

window.updatePublicLibrary = function(firebaseSongs) {
    setSyncStatus('Updating Library...', 0);
    if(!firebaseSongs) return;
    const songsArray = Object.values(firebaseSongs);
    window.allSongs = songsArray;
    try { localStorage.setItem(ALL_SONGS_KEY, JSON.stringify(window.allSongs)); } catch(e){}
    
    populateDropdown();
    if(currentId) loadSongById(currentId);
    
    setTimeout(() => {
        setSyncStatus('Library Updated', null); 
        setTimeout(()=>setSyncStatus(''), 2000);
    }, 600);
};

// --- APP STATE ---
window.allSongs = JSON.parse(localStorage.getItem(ALL_SONGS_KEY) || '[]');
let playlist = JSON.parse(localStorage.getItem(PLAYLIST_KEY) || '[]');
let currentId = localStorage.getItem(CURRENT_ID_KEY) || null;
let trans = 0;
let fontSizePx = 20;
const FONT_MIN = 12; const FONT_MAX = 42;
let playlistDraft = []; 

// --- DOM ELEMENTS ---
const readerEl = document.getElementById('reader');
const titleEl = document.getElementById('titleEl');
const artistEl = document.getElementById('artistEl');
const transKeyEl = document.getElementById('transKeyEl');
const keyDisplayBtn = document.getElementById('keyDisplayBtn');
const syncStatus = document.getElementById('syncStatus');
const songSelect = document.getElementById('songSelect');
const gearBtn = document.getElementById('gearBtn');
const gearPanel = document.getElementById('gearPanel');
const keyRow = document.getElementById('keyRow');
const mainFamilyDisplay = document.getElementById('mainFamilyDisplay');
const gearFamilyDisplay = document.getElementById('gearFamilyDisplay');
const capoDisplay = document.getElementById('capoDisplay');
const floatDock = document.getElementById('floatDock');
const openSetlistBtn = document.getElementById('openSetlistBtn');
const setlistModal = document.getElementById('setlistModal');
const setlistListEl = document.getElementById('setlistList');
const saveSetlistBtn = document.getElementById('saveSetlistBtn');
const cancelSetlistBtn = document.getElementById('cancelSetlistBtn');
const setlistStatsEl = document.getElementById('setlistStats');
const xCloseSetlistBtn = document.getElementById('xCloseSetlistBtn');
const themeToggleBtn = document.getElementById('themeToggleBtn');

const KEY_BUTTONS = ['A','A#','Bb','B','C','C#','Db','D','D#','Eb','E','Fb','F','F#','Gb','G','G#','Ab'];
const NOTES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_TO_INDEX = {C:0,'B#':0,'C#':1,'Db':1,D:2,'D#':3,'Eb':3,E:4,'Fb':4,F:5,'E#':5,'F#':6,'Gb':6,G:7,'G#':8,'Ab':8,A:9,'A#':10,'Bb':10,B:11,'Cb':11};
const CHORD_RE = /\b([A-G](?:#|b)?)(?:(maj|min|m|dim|aug|sus|add)?(?:\d+)?(?:[#b+\-])?)?(?:\/([A-G](?:#|b)?))?(?:\s|$|(?=\())/g;

// --- HELPERS ---
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function transposeRoot(root, semitones, targetKeyName){
  const rootStr = (root||'').replace('♯','#').replace('♭','b');
  const idx = NOTE_TO_INDEX[rootStr];
  if(idx == null) return root;
  const song = window.allSongs.find(x => x.id === currentId);
  const currentKey = song?.key || guessOriginalKeyFromContent(song?.content) || 'C';
  const currentKeyIdx = NOTE_TO_INDEX[currentKey.replace('♯','#').replace('♭','b')];
  let degree = (idx - currentKeyIdx) % 12;
  if(degree < 0) degree += 12;
  const targetKey = targetKeyName.replace('♯','#').replace('♭','b');
  const family = KEY_FAMILIES[targetKey];
  if(!family) {
    let ni = (idx + semitones) % 12; if(ni < 0) ni += 12;
    return targetKey.includes('b') ? NOTES_FLAT[ni] : NOTES_SHARP[ni];
  }
  const degreeMap = { 0:0, 2:1, 4:2, 5:3, 7:4, 9:5, 11:6 };
  if(degreeMap[degree] !== undefined) {
      const rawChord = family[degreeMap[degree]];
      return rawChord.replace(/(m|dim)$/, '');
  }
  let ni = (idx + semitones) % 12; if(ni < 0) ni += 12;
  return targetKey.includes('b') ? NOTES_FLAT[ni] : NOTES_SHARP[ni];
}
function transposeText(text, semitones, targetKeyName){
  if(typeof semitones !== 'number' || semitones === 0) return text;
  return text.replace(CHORD_RE, (m, root, mod, slash) => {
    const nr = transposeRoot(root, semitones, targetKeyName);
    // FIX: the match may end with one whitespace char (or newline). Keep it aside so it is neither lost nor counted as part of the bass note.
    const tail = /\s$/.test(m) ? m.slice(-1) : '';
    let suffix = (tail ? m.slice(0, -1) : m).slice(root.length);
    if (slash) suffix = suffix.slice(0, -(slash.length + 1));
    const bass = slash ? '/' + transposeRoot(slash, semitones, targetKeyName) : '';
    return nr + suffix + bass + tail;
  });
}
function fixDoubleSharps(note){
  if(!note) return note;
  return note.replace(/([A-G])##/g, (match, root) => {
    const enh = { C: "D", D: "E", E: "F#", F: "G", G: "A", A: "B", B: "C#" };
    return enh[root] || match;
  });
}
function highlightHtml(text, targetKeyName, semitones){
  let t = text || '';
  if(typeof semitones === 'number' && semitones !== 0) t = transposeText(t, semitones, targetKeyName);
  let escaped = escapeHtml(t);
  escaped = escaped.replace(CHORD_RE, (m, root, mod, slash) => { return `<span class="chord">${fixDoubleSharps(m)}</span>`; });
  const sectionRegex = /\b(Verse\s*\d*|Chorus\s*\d*|Bridge|Pre[-\s]?Chorus|Post[-\s]?Chorus|Intro|Interlude|Instrumental|Tag|Ending|Refrain|Repeat|Outro)\b/gi;
  escaped = escaped.replace(sectionRegex, (label) => `<span class="section-label">${label}</span>`);

}
function setSyncStatus(msg, percent = null){

  const overlay = document.getElementById('statusOverlay');

function renderContent(text, targetKey){

function guessOriginalKeyFromContent(text){
  if(!text) return null;
  const counts = {}; let m; CHORD_RE.lastIndex = 0;
  while((m = CHORD_RE.exec(text)) !== null){
    const root = m[1]; if(!root) continue;
    const normalized = root.replace('♯','#').replace('♭','b');
    if(NOTE_TO_INDEX[normalized] == null) continue;
    counts[normalized] = (counts[normalized]||0)+1;
  }
  const keys = Object.keys(counts); if(keys.length === 0) return null;
  let best = null, bestCnt = -1;
  for(const k of keys){ if(counts[k] > bestCnt){ best = k; bestCnt = counts[k]; } }
  return best;
}
function computeSemitoneShift(originalKeyName, targetKeyName){
  const o = (originalKeyName||'').replace('♯','#').replace('♭','b');
  const t = (targetKeyName||'').replace('♯','#').replace('♭','b');
  const oi = NOTE_TO_INDEX[o]; const ti = NOTE_TO_INDEX[t];
  if(oi == null || ti == null) return 0;
  let delta = ti - oi; if(delta > 6) delta -= 12; if(delta < -6) delta += 12;
  return delta;
}

function renderChordFamily(keyName) {

    else {

            const degree = FAMILY_DEGREES[i] || ''; const isPrimary = (i === 0 || i === 3 || i === 4); const isDim = (i === 6);
            let chordClass = 'family-chord'; if (isPrimary) chordClass += ' primary'; if (isDim) chordClass += ' dim';
            return `<div class="family-pill"><span class="family-degree">${degree}</span><span class="${chordClass}">${chord}</span></div>`;

    }

}

function renderPrintView() {
    const song = window.allSongs.find(s => s.id === currentId);
    
    // Update Button States
    const idx = playlist.indexOf(currentId);
    const prevBtn = document.getElementById('printPrevBtn');
    const nextBtn = document.getElementById('printNextBtn');
    if (prevBtn) {
        prevBtn.disabled = (idx <= 0);
        prevBtn.style.opacity = (idx <= 0) ? '0.4' : '1';
        prevBtn.style.cursor = (idx <= 0) ? 'not-allowed' : 'pointer';
    }
    if (nextBtn) {
        nextBtn.disabled = (idx < 0 || idx >= playlist.length - 1);
        nextBtn.style.opacity = (idx < 0 || idx >= playlist.length - 1) ? '0.4' : '1';
        nextBtn.style.cursor = (idx < 0 || idx >= playlist.length - 1) ? 'not-allowed' : 'pointer';
    }

    if(!song) {
        document.getElementById('phTitleMain').textContent = "No Song Selected";
        return;
    }

    const settings = getSongSettings(currentId) || {};
    const semitones = Number(settings.transpose || 0);

    const songKey = song.key || guessOriginalKeyFromContent(song.content) || 'C';
    let targetKeyName = settings.chosenKey;
    if (!targetKeyName) {
         targetKeyName = (semitones === 0) ? songKey : transposeRoot(songKey, semitones, 'C');   // FIX: same as the reader (was always C)
    }

    document.getElementById('phKeyEl').textContent = targetKeyName;
    document.getElementById('phFontEl').textContent = printFontSize + 'pt';
    document.getElementById('phColsEl').textContent = onePageEnabled ? "Auto" : printCols;

    const transText = semitones === 0 ? '' : (semitones > 0 ? `+${semitones}` : `${semitones}`);
    document.getElementById('printTitlePage').textContent = song.title;
    document.getElementById('printSubPage').textContent = `${song.artist || ''} • Key: ${targetKeyName} ${transText}`;

    const htmlWithSpans = highlightHtml(song.content || '', targetKeyName, semitones);
    
    // 🧠 THE SAFE SMART CUT: Line-by-Line, but glue chords to lyrics!
    const lines = htmlWithSpans.split(/\n/);
    let htmlWithDivs = '';
    
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i] || ' ';
        let inlineStyle = "margin-bottom: 0.2em; break-inside: avoid; page-break-inside: avoid;";
        
        // If this line has a Chord or a Section Label, glue it to the next line!
        if (line.includes('class="chord"') || line.includes('class="section-label"')) {
            inlineStyle += " break-after: avoid; page-break-after: avoid;";
        }
        
        htmlWithDivs += `<div class="reader-line" style="${inlineStyle}">${line}</div>`;
    }

    document.documentElement.style.setProperty('--print-chord-size', (printFontSize + 2) + 'pt');
    document.documentElement.style.setProperty('--print-col-gap', '40px');

function applyPreviewMode() {
    printWrap.classList.remove('cols1','cols2','cols3', 'onepage');
    
    if(onePageEnabled) {
        pageBox.style.display = 'block';
        scrollBox.style.display = 'none';
        printWrap.classList.add('onepage');
        fitToOnePage(); // Auto-scale logic
    } else {
        pageBox.style.display = 'none';
        scrollBox.style.display = 'block';
        
        printWrap.classList.add(printCols === 2 ? 'cols2' : printCols === 3 ? 'cols3' : 'cols1');
        
        printReaderPage.style.transform = '';
        printReaderPage.style.width = '';
    }
}

function fitToOnePage() {
    const root = document.documentElement;
    let textPt = parseFloat(getComputedStyle(root).getPropertyValue('--print-text-size')) || 14;
    let chordPt = parseFloat(getComputedStyle(root).getPropertyValue('--print-chord-size')) || 17;
    let line = 1.35;
    let gap = 40;

    printReaderPage.style.transform = '';
    printReaderPage.style.width = '';

    for(let steps=0; steps<50; steps++){ 
        const contentH = printReaderPage.scrollHeight;
        const pageH = pageBox.clientHeight - 60; 

        if(contentH <= pageH) break;

        if(line > 1.12) { line -= 0.02; root.style.setProperty('--print-line-height', String(line)); continue; }
        if(gap > 18) { gap -= 2; root.style.setProperty('--print-col-gap', gap + 'px'); continue; }
        if(textPt > 9) { 
            textPt -= 0.5; chordPt -= 0.5; 
            root.style.setProperty('--print-text-size', textPt + 'pt'); 
            root.style.setProperty('--print-chord-size', chordPt + 'pt'); 
            continue; 
        }
        
        const currentScale = parseFloat((printReaderPage.style.transform || '').replace(/[^0-9.]/g,'')) || 1;
        if(currentScale > 0.82){ 
            const next = Math.max(0.82, currentScale - 0.03); 
            printReaderPage.style.transformOrigin = 'top left';
            printReaderPage.style.transform = 'scale(' + next.toFixed(2) + ')'; 
            printReaderPage.style.width = (100/next).toFixed(2) + '%'; 
            continue; 
        } 
        break;
    }
}

  document.addEventListener('touchmove', (e) => {
     if (e.touches.length === 2 && initialPinchDistance && initialFontSize) {
         const currentDist = getDistance(e.touches[0], e.touches[1]); const diff = currentDist - initialPinchDistance; const step = 20; const changes = Math.floor(diff / step);
         if (changes !== 0) { const newSize = initialFontSize + (changes * 2); applyFontSize(newSize); }
     }
  }, {passive: true});
  function getDistance(t1, t2) { const dx = t1.screenX - t2.screenX; const dy = t1.screenY - t2.screenY; return Math.sqrt(dx * dx + dy * dy); }
  function handleSwipeGesture(startX, startY, endX, endY) {
    const diffX = endX - startX; const diffY = endY - startY;
    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD) { if (diffX > 0) { document.getElementById('prevSongBtn').click(); } else { document.getElementById('nextSongBtn').click(); } }
  }
}

    let loadedSongsMap = {};

    // 1. DYNAMIC SETLIST & TARGETED FETCHING
    onValue(ref(db, 'library/configs/arrange_songs'), (snapshot) => {
        const data = snapshot.val();
        const newPlaylist = (data && data.playlist) ? data.playlist : [];
        
        console.log("🔥 Firebase: Setlist Updated. Fetching only targeted songs...");

        // A. CLEANUP: If a song was removed from the setlist, stop listening to it
        Object.keys(activeSongListeners).forEach(id => {
            if (!newPlaylist.includes(id)) {
                console.log(`📡 Disconnecting listener for removed song: ${id}`);
                off(ref(db, `library/songs/${id}`));
                delete activeSongListeners[id];
                delete loadedSongsMap[id];
            }
        });

        // B. TARGETED FETCH: Only listen to songs that are actually in the setlist
        newPlaylist.forEach(id => {
            if (!activeSongListeners[id]) {
                const songRef = ref(db, `library/songs/${id}`);
                
                // Start a dedicated listener for this specific song
                activeSongListeners[id] = onValue(songRef, (songSnap) => {
                    const songData = songSnap.val();
                    
                    // Security: Only load if it's actually public
                    if (songData && songData.isPublic) {
                        loadedSongsMap[id] = { ...songData, id: id };
                        
                        // Push updated library map to the frontend
                        if(window.updatePublicLibrary) {
                            window.updatePublicLibrary(loadedSongsMap);
                        }
                    }
                });
            }
        });

        // Update the sequence in the Reader dropdown and navigation
        if(window.updateLocalSetlist) {
            window.updateLocalSetlist(newPlaylist);
        }
    });

    // 2. LIVE SONG EDITS (For emergency typo fixes during practice)
    onValue(ref(db, 'presentation/live_edit'), (snapshot) => {
        const data = snapshot.val();

            console.log("🔥 Firebase: Emergency Edit Received", data.songId);
            if(window.updateLocalSong) window.updateLocalSong(data.songId, data.data);
        }
    });

<script>
document.addEventListener("DOMContentLoaded", () => {
    const installPrompt = document.getElementById("installPrompt");
    const installBtn = document.getElementById("installBtn");
    const installMessage = document.getElementById("installMessage");
    const closeBtn = document.getElementById("closeInstallBtn");
    
    let deferredPrompt;

    // 1. Check if the app is ALREADY installed
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (isStandalone) {
        return; // It's already installed, so do nothing!
    }

    // 2. Allow user to dismiss the banner
    closeBtn.addEventListener("click", () => {
        installPrompt.style.display = "none";
    });

    // 3. ANDROID LOGIC: Catch the install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); // Prevent Chrome's default mini-bar
        deferredPrompt = e; // Save the event for later
        
        installPrompt.style.display = "block"; // Show our banner
        installBtn.style.display = "block";    // Show the button

        // When user clicks our Install button
        installBtn.addEventListener('click', async () => {
            installPrompt.style.display = "none";
            deferredPrompt.prompt(); // Trigger Chrome's native install prompt
            
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });
    });

    // 4. iOS LOGIC: Detect iPhone/iPad and Safari
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
    
    if (isIOS && isSafari && !isStandalone) {
        installPrompt.style.display = "block";
        // Change the text to give Apple-specific instructions
        installMessage.innerHTML = "To install: tap the <b>Share icon</b> <i class='bi bi-upload'></i> below, then choose <b>Add to Home Screen</b> <i class='bi bi-plus-square'></i>.";
        // Note: installBtn remains hidden because iOS doesn't allow one-click install
    }
});
</script>
